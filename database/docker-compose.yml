services:
  postgres:
    image: postgres:16

    container_name: crisp_postgres

    environment:
      POSTGRES_DB: crisp
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: crisppassword

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql

volumes:
  postgres_data: