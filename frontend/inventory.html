<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CRISP - Inventory</title>
    <link rel="stylesheet" href="Styles/overview.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <link rel="stylesheet" href="/Styles/sidebar.css">
    <link rel="stylesheet" href="/Styles/layout.css">
</head>

<body>
    <!-------------nav-bar / side-bar--------------------->


    <!--------------------header------------------------->

    <div class="page">
        <header class="page-header">
            <div>
                <h1>Inventory</h1>
                <p class="sub"> Maintain CRISP monitor for vulnerability exposure</p>
            </div>
            <div class="btn-group">
                <button class="import-btn">Import CSV</button>
                <input type="file" id="csvFile" accept=".csv" hidden>
                <select id="import-type" aria-label="CSV import type">
                    <option value="Auto-detect">Auto-detect</option>
                    <option value="Firewall inventory">Firewall inventory</option>
                    <option value="General inventory">General inventory</option>
                    <option value="Software inventory">Software inventory</option>
                </select>
                <p id="import-status" role="status" aria-live="polite"></p>
                <button class="asset-btn" id="openMode">Add asset</button>
                <div class="mode-overlay" id="assetMode">
                    <div class="mode">
                        <!--formgoes here -->
                        <div class="mode-head">
                         <div>
                        <h1 id="mode-title">Add Inventory asset</h1>
                        <p class="sub"> Register a technology device for monitoring.</p>
                         </div>
                        <button type="button" class="close" id="closeMode" aria-label="Close">&times;</button>
                            </div>
                            
                        <form id="assetForm">
                            <div class="grid">

                                <div>
                                    <label for="assetType">Asset type</label>
                                    <select id="assetType" name="type">
                                        <option value="Firewall">Firewall</option>
                                        <option value="VPN Endpoint">VPN endpoint</option>
                                        <option value="Switch">Switch</option>
                                        <option value="Access Point">Access point</option>
                                        <option value="SaaS">Software (SaaS)</option>
                                    </select>
                                </div>
                                <div>
                                    <label for="status">Monitoring</label>
                                    <select id="status" name="status">
                                        <option>Active</option>
                                        <option>pause</option>
                                    </select>
                                </div>
                                <div class="full">
                                    <label for="asset-lab">Asset name</label>
                                    <input id="name" name="name" placeholder="....." required>
                                    </div>

                                    <div>
                                    <label for="assetVendor">Vendor</label>
                                    <input id="assetVendor" name="vendor" placeholder="....." required>
                                    </div>

                                    <div>
                                    <label for="prod-lab">Product/model</label>
                                    <input id="product" name="product" placeholder="....." required>
                                    </div>

                                    <div>
                                    <label for="soft-lab">Software/firmware version</label>
                                    <input id="software" name="software" placeholder="....." required> 
                                    </div>

                                <div>
                                    <label for="pub-fac">Public-facing</label>
                                    <select id="public" name="public">
                                        <option>Yes</option>
                                        <option>No</option>
                                    </select>
                                </div>

                                </div>
                                
                            <div class="actions">
                                <button type="button" class="btn btn-cancel" id="cancelMode">Cancel</button>
                                <button type="submit" class="btn btn-save" id="saveMode">Save asset</button>
                                </div>
                        </form>
                        
                        </div>
                    </div>
                </div>
            </div>
        </header>
        <!----------------Top row---------------------->
        <section class="stats">

                        <div class="card">
                <div class="label">Total inventory</div>
                <div class="info" data-stat="total">---</div>
            </div>

            <div class="card">
                <div class="label">Actively monitored</div>
                <div class="info" data-stat="active">---</div>
            </div>

            <div class="card">
                <div class="label">Affected assets</div>
                <div class="info" data-stat="affected">---</div>
            </div>

            <div class="card green">
                <div class="label">Needs attention</div>
                <div class="info" data-stat="needsAttention">---</div>
            </div>

        </section>

        <!------------------table------------------------>

        <!--------search/filters----------->
        <section class="card table-card">
            <div class="filter-bar">
                <div class="search">
                    <i class="bi bi-search"></i>
                    <input type="text" id="search" placeholder="Search inventory...">
                </div>

                <select id="asset-type" class="filter-select">
                    <option value="">All asset types</option>
                    <option value="firewall">Firewalls</option>
                    <option value="switch">Switch</option>
                    <option value="ap">ap</option>
                </select>
                <select id="vendor" class="filter-select">
                    <option value="">All vendors</option>
                    <option value="fortinet">Fortinet</option>
                    <option value="microsoft">Microsoft</option>
                </select>
            </div>
            <!-------------------------------->

            <div class="table-wrap">
                <table class=" findings-table">
                    <thread>
                        <tr>
                            <th>asset</th>
                            <th>type</th>
                            <th>vendor / product</th>
                            <th>version</th>
                            <th>monitoring</th>
                            <th>findings</th>
                        </tr>
                    </thread>
                    <tbody id="inventory-body"></tbody>
                </table>
            </div>
        </section>

        <script src="src/inventory.js"></script>
        <script src="/src/layout.js"></script>

</body>

</html>
