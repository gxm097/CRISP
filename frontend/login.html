<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CRISP - Sign in</title>
    <link rel="stylesheet" href="/Styles/login.css">
</head>

<body>
    <main class="login-card">

        <div class="brand">
            <div class="brand-name">CRISP</div>
            <p class="brand-tagline">Continuous vulnerability monitoring</p>
        </div>

        <h1>Sign in</h1>

        <p id="message" class="login-error" role="alert" hidden>Wrong username or password.</p>

        <form action="/login" method="POST">
            <label for="username">Username</label>
            <input id="username" name="username" type="text" autocomplete="username" required autofocus>

            <label for="password">Password</label>
            <input id="password" name="password" type="password" autocomplete="current-password" required>

            <button type="submit" class="login-button">Sign in</button>
        </form>

    </main>

    <script>
        // show the error message when the server sends us back with ?error=1
        if (new URLSearchParams(window.location.search).has('error')) {
            document.getElementById('message').hidden = false;
        }
    </script>
</body>

</html>
